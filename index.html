<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Webshop</title>
</head>
<body>
    <h1>Webshopapi</h1>
    <label for="cim">Új User hozzáadása</label>
        <input type="text" id="nev" placeholder="Név">
        <input type="text" id="email" placeholder="Email-cím">
        <input type="text" id="varos" placeholder="Város">
        <input type="number" id="telefonszam" placeholder="Telefonszám">
        <input type="text" id="szerep" placeholder="Szerep">
        
     
        <button id="mentesGomb" type="button" onclick="hozzaadUser()">Hozzáad</button>
        <button id="megseGomb" type="button" class="btn btn-secondary" style="display:none" onclick="urlapTorles()">Mégse</button>
        
    <div class="container-fluid" d-flex justify-content-center p-4 flex-column align-items-center gap-2 w-25>
        <table id="data" class="table table-striped table-dark">
    <thead>
        <tr class="table-dark">
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">City</th>
            <th scope="col">Phone</th>
            <th scope="col">Role</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

    </div>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>  
    <script src="app.js"></script>
</body>
</html>
